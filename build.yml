name: Build FSRForgeOpti

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Organizar arquivos em pastas
        run: |
          if [ -f FSRForgeOpti.java ]; then
            mkdir -p src/main/java/com/fsrforgeopti
            mkdir -p src/main/resources/assets/fsrforgeopti/shaders
            mv ./*.java src/main/java/com/fsrforgeopti/
            mv ./*.fsh src/main/resources/assets/fsrforgeopti/shaders/
            mv mcmod.info src/main/resources/
          fi
          find . -type f -not -path './.git/*' | sort

      - name: Instalar JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Baixar Gradle 2.14.1
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle.zip -d $HOME
          echo "$HOME/gradle-2.14.1/bin" >> $GITHUB_PATH

      - name: Compilar
        run: gradle setupCIWorkspace build --no-daemon --stacktrace

      - name: Publicar jar
        uses: actions/upload-artifact@v4
        with:
          name: FSRForgeOpti-jar
          path: build/libs/*.jar
